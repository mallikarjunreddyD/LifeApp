name: Android verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          # Override the action default, which includes the obsolete `tools` package.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android and JVM foundation
        id: verification
        run: ./gradlew :shared:core:jvmTest :shared:domain:jvmTest :shared:data:jvmTest :shared:ui:jvmTest :apps:android:assembleDebug :apps:android:lintDebug :apps:desktop:classes --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: my-journal-debug
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.verification.outcome != 'skipped'
        with:
          name: test-reports
          path: |
            shared/**/build/reports/tests/
            shared/**/build/test-results/
            apps/android/build/reports/lint-results-debug.*
          if-no-files-found: error
