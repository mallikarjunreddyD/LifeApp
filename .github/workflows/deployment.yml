name: Deployment images
on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/deployment.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified main images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIFEAPP_API_IMAGE: lifeapp-api:verification
      LIFEAPP_WEB_IMAGE: lifeapp-web:verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: deploy/scripts/build-images.sh
      - name: Install verified recovery tools
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/lifeapp-recovery-tools.XXXXXX")
          cd "$work"
          curl -fsSL --retry 3 --max-time 60 -o age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          curl -fsSL --retry 3 --max-time 60 -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.70.3/rclone-v1.70.3-linux-amd64.zip
          sha256sum -c <<'EOF'
          cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  age.tar.gz
          7d69057e69385f6514a9684c7eaa424d972096b130284bb34dd967c4ed4f9dad  rclone.zip
          EOF
          tar -xzf age.tar.gz age/age age/age-keygen
          unzip -q rclone.zip rclone-v1.70.3-linux-amd64/rclone
          install -m 755 -D age/age "$work/bin/age"
          install -m 755 age/age-keygen rclone-v1.70.3-linux-amd64/rclone "$work/bin/"
          echo "$work/bin" >> "$GITHUB_PATH"
      - run: python3 -B deploy/backup/test-retention.py
      - run: python3 -B deploy/backup/test-automatic-retention.py
      - run: deploy/scripts/smoke.sh
        env:
          LIFEAPP_SMOKE_RESTORE: '1'
      - if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: docker save "$LIFEAPP_API_IMAGE" "$LIFEAPP_WEB_IMAGE" | gzip > images.tar.gz
      - if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-images
          path: images.tar.gz
          retention-days: 1
  publish:
    needs: verify-images
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lifeapp-image-publish
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Check regression results for this exact main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for workflow in android.yml server.yml web.yml; do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&head_sha=$GITHUB_SHA" --jq '.workflow_runs[0].id')
            [[ "$run_id" =~ ^[0-9]+$ ]]
            if [[ "$workflow" == android.yml ]]; then
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest" --jq '.jobs[] | select(.conclusion == "success") | .name')
              for job in verify android-input android-server; do
                grep -Fxq "$job" <<< "$jobs"
              done
            else
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)" = success
            fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: verified-images
      - name: Publish tested images and record digests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          gzip -dc images.tar.gz | docker load
          for component in api web; do
            repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lifeapp-$component"
            tag="$repo:$GITHUB_SHA"
            docker tag "lifeapp-$component:verification" "$tag"
            docker push "$tag"
            digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)
            printf '%s\n' "$repo@$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nCommit %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
