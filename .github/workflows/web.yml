name: Web PWA verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies and browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium
      - name: Check TypeScript, lint and local persistence
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Test the HTTPS PWA against disposable Ktor and PostgreSQL
        run: apps/web/scripts/test-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-browser-report
          path: apps/web/test-results/browser.xml
