name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          # Override the action default, which includes the obsolete `tools` package.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate OpenAPI and client fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/lifeapp-contract"
          "$RUNNER_TEMP/lifeapp-contract/bin/pip" install -r contracts/requirements.txt
          "$RUNNER_TEMP/lifeapp-contract/bin/python" contracts/check.py
      - name: Verify Android and JVM foundation
        id: verification
        run: ./gradlew :shared:core:jvmTest :shared:domain:jvmTest :shared:data:jvmTest :shared:ui:jvmTest :apps:android:assembleDebug :apps:android:lintDebug :apps:desktop:classes :apps:android:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: my-journal-ci-debug-ephemeral
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.verification.outcome != 'skipped'
        with:
          name: test-reports
          path: |
            shared/**/build/reports/tests/
            shared/**/build/test-results/
            apps/android/build/reports/lint-results-debug.*
          if-no-files-found: error

  android-input:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android input and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :apps:android:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-input-reports
          path: |
            apps/android/build/reports/androidTests/
            apps/android/build/outputs/androidTest-results/
          if-no-files-found: warn

  android-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android and PWA sync against Ktor and PostgreSQL
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LIFEAPP_ANDROID_BRIDGE: '1'
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 600
          script: apps/web/scripts/test-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-server-sync-reports
          path: |
            apps/android/build/reports/androidTests/
            apps/android/build/outputs/androidTest-results/
            apps/web/test-results/browser.xml
          if-no-files-found: warn

  signed-apk:
    name: Persistent-key installable APK
    needs: [verify, android-input, android-server]
    # Signing is limited to main and named branches authorized for pre-merge builds.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-6c-android-server-sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Isolate signing build state from shared caches
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/lifeapp-signed-gradle" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Restore and verify the persistent signing identity
        env:
          LIFEAPP_SIGNING_KEYSTORE_BASE64: ${{ secrets.LIFEAPP_SIGNING_KEYSTORE_BASE64 }}
          LIFEAPP_SIGNING_STORE_PASSWORD: ${{ secrets.LIFEAPP_SIGNING_STORE_PASSWORD }}
          LIFEAPP_SIGNING_KEY_ALIAS: ${{ secrets.LIFEAPP_SIGNING_KEY_ALIAS }}
        run: python3 .github/scripts/prepare-signing.py
      - name: Build installable APK with the established key
        env:
          LIFEAPP_SIGNING_STORE_PASSWORD: ${{ secrets.LIFEAPP_SIGNING_STORE_PASSWORD }}
          LIFEAPP_SIGNING_KEY_ALIAS: ${{ secrets.LIFEAPP_SIGNING_KEY_ALIAS }}
          LIFEAPP_SIGNING_KEY_PASSWORD: ${{ secrets.LIFEAPP_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :apps:android:assembleDebug --no-daemon --no-build-cache --no-configuration-cache --console=plain
      - name: Verify APK signer against the public certificate pin
        run: python3 .github/scripts/verify-installable-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: my-journal-installable
          path: dist/installable/
          if-no-files-found: error
      - name: Remove runner-temporary signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/lifeapp-signing"
