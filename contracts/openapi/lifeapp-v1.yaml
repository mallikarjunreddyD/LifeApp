openapi: 3.1.1
info:
  title: LifeApp server contract
  version: 1.0.0
  description: Phase 6A implements sessions, To-do synchronization and read-only workout endpoints.
security:
- browserSession: []
- androidBearer: []
paths:
  /health:
    get:
      operationId: health
      description: Process liveness without internal details.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Http503'
      security: []
  /ready:
    get:
      operationId: ready
      description: Database and migration readiness.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Http503'
      security: []
  /v1/session:
    post:
      operationId: login
      description: Rate limited login. Browser uses a secure HttpOnly cookie and receives
        a CSRF token. Android receives a short-lived bearer token. Validate Origin
        for browser requests.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Browser only. __Host-lifeapp_session with Secure, HttpOnly,
                SameSite and Path=/.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
    get:
      operationId: session
      description: Returns the authorized dataset and epoch. Browser may refresh its
        CSRF token.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
    delete:
      operationId: logout
      description: Revokes the current session. Cookie clients require Origin and
        CSRF validation.
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
  /v1/bootstrap:
    get:
      operationId: bootstrap
      description: Returns the session dataset and the sequence-zero checkpoint. Replay
        the ordered history on a fresh client.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/sync/push:
    post:
      operationId: push
      description: One immutable operation, up to 16 KiB. Repeating an identical operation
        returns its original commit. Cookie clients require CSRF.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgment'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Push'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
  /v1/ink/staged/{uploadId}:
    put:
      operationId: stageInk
      description: Store validated LJPT v1 bytes temporarily. Identical retries within the staging period are idempotent.
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Dataset
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Epoch
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Content-SHA256
        in: header
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Bytes staged without making a stroke visible.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '408':
          $ref: '#/components/responses/Http408'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/journal/ink/commit:
    post:
      operationId: commitJournalInk
      description: Atomically create a single-page journal entry if needed and attach a staged stroke. Replays require matching records and digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, entry, stroke, uploadId, sha256]
              properties:
                scope:
                  $ref: '#/components/schemas/Scope'
                entry:
                  type: object
                  description: Portable JournalEntry JSON containing one active page.
                stroke:
                  type: object
                  description: Portable stroke header without pointsFile or pointsBase64.
                uploadId:
                  type: string
                  format: uuid
                sha256:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
      responses:
        '204':
          description: Stroke committed or identical commit replayed.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/journal/entries:
    get:
      operationId: listJournalEntries
      description: List committed portable journal entries in ascending entry UUID order.
      parameters:
      - name: X-LifeApp-Dataset
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Epoch
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Page of results. Pass next as cursor to continue, or stop when it is null.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      description: Portable JournalEntry JSON containing one active page.
                      required: [metadata, date, pages]
                  next:
                    type: [string, 'null']
                    format: uuid
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '409':
          $ref: '#/components/responses/Http409'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/journal/pages/{pageId}/strokes:
    get:
      operationId: listJournalStrokes
      description: List committed stroke headers and checksums in the original stroke order.
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Dataset
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Epoch
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Page of results. Pass next as cursor to continue, or stop when it is null.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [stroke, sha256]
                      properties:
                        stroke:
                          type: object
                          description: Portable stroke header. Points are returned by the binary endpoint.
                          required: [metadata, surfaceId, order, brush, colorArgb, width, pointFormatVersion]
                        sha256:
                          type: string
                          pattern: '^[0-9a-f]{64}$'
                  next:
                    type: [string, 'null']
                    format: uuid
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/journal/ink/{strokeId}:
    get:
      operationId: downloadJournalInk
      description: Return committed LJPT bytes from the authenticated dataset. Supply both scope headers to require a matching session scope.
      parameters:
      - name: strokeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Dataset
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: X-LifeApp-Epoch
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Original committed LJPT bytes.
          headers:
            X-Content-SHA256:
              schema:
                type: string
                pattern: '^[0-9a-f]{64}$'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/staged/{versionId}:
    put:
      operationId: stageEditableRecord
      description: Validate and stage an archive containing a single journal entry, planner, habit ledger, or notebook and its children.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      - name: X-Content-SHA256
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/EditableDigest'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: The archive is staged or was previously committed with the same digest.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '408':
          $ref: '#/components/responses/Http408'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions/{versionId}/commit:
    post:
      operationId: commitEditableRecord
      description: Commit staged bytes and update the version heads atomically.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256, parents]
              additionalProperties: false
              properties:
                sha256:
                  $ref: '#/components/schemas/EditableDigest'
                parents:
                  $ref: '#/components/schemas/EditableParents'
                requireEmpty:
                  type: boolean
                  default: false
                  description: Reject a new import if any version already exists for the record key. Requires empty parents.
      responses:
        '204':
          description: Committed, or already committed with identical bytes and parents.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions:
    get:
      operationId: listEditableRecordVersions
      description: List immutable committed versions in order. Sequences may contain gaps.
      parameters:
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      - name: after
        in: query
        schema:
          type: string
          pattern: '^(0|[1-9][0-9]{0,18})$'
          default: '0'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Committed versions after the exclusive sequence.
          content:
            application/json:
              schema:
                type: object
                required: [scope, hasMore, items]
                properties:
                  scope:
                    $ref: '#/components/schemas/Scope'
                  hasMore:
                    type: boolean
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/EditableVersion'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '409':
          $ref: '#/components/responses/Http409'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions/{versionId}:
    get:
      operationId: downloadEditableRecordVersion
      description: Read original ZIP archive bytes from the authenticated dataset.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      responses:
        '200':
          description: Original archive.
          headers:
            X-Content-SHA256:
              schema:
                $ref: '#/components/schemas/EditableDigest'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions/{versionId}/review:
    get:
      operationId: reviewEditableRecordVersions
      description: List every current version for the same record key as the referenced version.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      responses:
        '200':
          description: Current versions in commit order.
          content:
            application/json:
              schema:
                type: object
                required: [scope, kind, key, variants]
                properties:
                  scope:
                    $ref: '#/components/schemas/Scope'
                  kind:
                    type: string
                    enum: [journal, planner, habits, notebook]
                  key:
                    type: string
                  variants:
                    type: array
                    minItems: 1
                    maxItems: 32
                    items:
                      type: object
                      required: [id, sequence]
                      properties:
                        id:
                          type: string
                          format: uuid
                        sequence:
                          type: string
                          pattern: '^[1-9][0-9]{0,18}$'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions/{versionId}/resolve:
    post:
      operationId: resolveEditableRecordVersions
      description: Make a copy of the selected current archive the sole current version if all reviewed versions are still current. Keep previous versions in history.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reviewed]
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                  description: Stable UUID of the resolution for retries.
                reviewed:
                  type: array
                  minItems: 2
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Resolution committed, or previously committed with identical archive bytes and parents.
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/editable/versions/{versionId}/preview:
    get:
      operationId: previewEditableRecordVersion
      description: Read a bounded vector preview of an immutable record version.
      parameters:
      - $ref: '#/components/parameters/EditableVersion'
      - $ref: '#/components/parameters/EditableDataset'
      - $ref: '#/components/parameters/EditableEpoch'
      responses:
        '200':
          description: Logical pages with LJPT points encoded as Base64, or a habit summary.
          content:
            application/json:
              schema:
                type: object
                required: [title, pages, habits]
                properties:
                  title:
                    type: string
                  pages:
                    type: array
                    items:
                      type: object
                      required: [title, width, height, archived, cells, strokes]
                  habits:
                    type: array
                    items:
                      type: object
                      required: [name, archived, completedDays]
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
  /v1/sync/pull:
    get:
      operationId: pull
      description: Read strictly contiguous commits after the supplied exclusive cursor.
        Maximum 100 per response.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPage'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          $ref: '#/components/responses/Http409'
        '410':
          $ref: '#/components/responses/Http410'
      parameters:
      - name: after
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Sequence'
      - name: epoch
        in: query
        required: true
        schema: &id001
          type: string
          format: uuid
  /v1/conflicts:
    get:
      operationId: conflicts
      description: Lists unresolved concurrent heads scoped to the current account.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictPage'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      parameters:
      - &id002
        name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 512
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
  /v1/conflicts/{recordId}/resolve:
    post:
      operationId: resolve
      description: Submit a successor naming all reviewed heads. Reject stale resolutions.
        Cookie clients require CSRF.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgment'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '413':
          $ref: '#/components/responses/Http413'
      parameters:
      - &id004
        name: recordId
        in: path
        required: true
        schema: *id001
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resolution'
  /v1/todos:
    get:
      operationId: todos
      description: Read server projections. Clients mutate through sync push.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoPage'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      parameters:
      - *id002
      - *id003
  /v1/todos/{recordId}:
    get:
      operationId: todo
      description: Read one current task projection.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
        '404':
          $ref: '#/components/responses/Http404'
      parameters:
      - *id004
  /v1/workouts:
    get:
      operationId: workouts
      description: Proposed read endpoint for recorded sessions. Mutation protocol
        is deferred.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPage'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      parameters:
      - *id002
      - *id003
  /v1/workouts/{recordId}:
    get:
      operationId: workout
      description: Read a recorded session with ordered entries and sets.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
        '404':
          $ref: '#/components/responses/Http404'
      parameters:
      - *id004
  /v1/exercises:
    get:
      operationId: exercises
      description: List exercise definitions, including archived definitions used
        by history.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercisePage'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
      parameters:
      - *id002
      - *id003
  /v1/backups/status:
    get:
      operationId: backupStatus
      description: Owner-only summary. Does not return backup contents, credentials
        or storage locations.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupStatus'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '429':
          $ref: '#/components/responses/Http429'
        '503':
          $ref: '#/components/responses/Http503'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      name: __Host-lifeapp_session
      in: cookie
    androidBearer:
      type: http
      scheme: bearer
  parameters:
    EditableDataset:
      name: X-LifeApp-Dataset
      in: header
      required: true
      schema:
        type: string
        format: uuid
    EditableEpoch:
      name: X-LifeApp-Epoch
      in: header
      required: true
      schema:
        type: string
        format: uuid
    EditableVersion:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    EditableDigest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    EditableParents:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        format: uuid
    EditableVersion:
      type: object
      required: [id, sequence, kind, key, rootId, sha256, parents, current]
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: string
          pattern: '^[1-9][0-9]{0,18}$'
        kind:
          type: string
          enum: [journal, planner, habits, notebook]
        key:
          type: string
          description: Date, month or notebook UUID according to kind.
        rootId:
          type: string
          format: uuid
        sha256:
          $ref: '#/components/schemas/EditableDigest'
        parents:
          $ref: '#/components/schemas/EditableParents'
        current:
          type: boolean
    Sequence:
      type: string
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: Unsigned decimal string in 0..9223372036854775807. Zero is the
        initial cursor.
    PositiveSequence:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Positive signed 64-bit integer encoded as a decimal string.
    Scope:
      type: object
      additionalProperties: false
      required:
      - dataset
      - epoch
      properties:
        dataset: *id001
        epoch: *id001
    Checkpoint:
      type: object
      additionalProperties: false
      required:
      - scope
      - sequence
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        sequence:
          $ref: '#/components/schemas/Sequence'
    Metadata:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - updatedAt
      - schemaVersion
      - revision
      properties:
        id: *id001
        createdAt: &id005
          type: string
          format: date-time
        updatedAt: *id005
        schemaVersion:
          const: 1
        revision:
          $ref: '#/components/schemas/PositiveSequence'
    Todo:
      type: object
      additionalProperties: false
      required:
      - metadata
      - title
      - deadline
      - completedAt
      - deleted
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        title:
          type: string
          minLength: 1
          maxLength: 200
        deadline:
          type: string
          format: date
        completedAt:
          anyOf:
          - *id005
          - type: 'null'
        deleted: &id006
          type: boolean
    TodoOperation:
      type: object
      additionalProperties: false
      required:
      - format
      - protocolVersion
      - operationId
      - deviceId
      - sequence
      - payloadVersion
      - recordType
      - recordId
      - type
      - parents
      - record
      properties:
        format:
          const: LifeAppOperation
        protocolVersion:
          const: 1
        operationId: *id001
        deviceId: *id001
        sequence:
          $ref: '#/components/schemas/PositiveSequence'
        payloadVersion:
          const: 1
        recordType:
          const: todo
        recordId: *id001
        type:
          enum:
          - put
          - delete
        parents:
          type: array
          maxItems: 128
          items: *id001
          uniqueItems: true
        record:
          $ref: '#/components/schemas/Todo'
    Commit:
      type: object
      additionalProperties: false
      required:
      - sequence
      - operation
      properties:
        sequence:
          $ref: '#/components/schemas/PositiveSequence'
        operation:
          $ref: '#/components/schemas/TodoOperation'
    Push:
      type: object
      additionalProperties: false
      required:
      - scope
      - operation
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        operation:
          $ref: '#/components/schemas/TodoOperation'
    Acknowledgment:
      type: object
      additionalProperties: false
      required:
      - scope
      - commit
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        commit:
          $ref: '#/components/schemas/Commit'
    SyncPage:
      type: object
      additionalProperties: false
      required:
      - scope
      - entries
      - hasMore
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Commit'
        hasMore: *id006
    Conflict:
      type: object
      additionalProperties: false
      required:
      - recordId
      - heads
      properties:
        recordId: *id001
        heads:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/TodoOperation'
          minItems: 2
    ConflictPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Conflict'
        next:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
    Resolution:
      type: object
      additionalProperties: false
      required:
      - scope
      - operation
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        operation:
          $ref: '#/components/schemas/TodoOperation'
    TodoPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Todo'
        next:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
    Weight:
      type: object
      additionalProperties: false
      required:
      - value
      - unit
      properties:
        value:
          type: number
          minimum: 0
        unit:
          enum:
          - KG
          - LB
    Set:
      type: object
      additionalProperties: false
      required:
      - metadata
      - entryId
      - number
      - weight
      - repetitions
      - durationSeconds
      - restSeconds
      - completed
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        entryId: *id001
        number:
          type: integer
          minimum: 1
        weight:
          anyOf:
          - $ref: '#/components/schemas/Weight'
          - type: 'null'
        repetitions:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        durationSeconds:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        restSeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        completed: *id006
    WorkoutEntry:
      type: object
      additionalProperties: false
      required:
      - metadata
      - sessionId
      - exerciseId
      - order
      - round
      - sets
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        sessionId: *id001
        exerciseId: *id001
        order:
          type: integer
          minimum: 0
        round:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        sets:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Set'
    Workout:
      type: object
      additionalProperties: false
      required:
      - metadata
      - date
      - startedAt
      - endedAt
      - durationSeconds
      - caloriesKcal
      - notes
      - completed
      - entries
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        date:
          type: string
          format: date
        startedAt:
          anyOf:
          - *id005
          - type: 'null'
        endedAt:
          anyOf:
          - *id005
          - type: 'null'
        durationSeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        averageHeartRateBpm:
          type: integer
          minimum: 20
          maximum: 250
        durationManuallyEntered:
          type: boolean
        caloriesKcal:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        notes:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
        completed: *id006
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/WorkoutEntry'
    Exercise:
      type: object
      additionalProperties: false
      required:
      - metadata
      - name
      - category
      - equipment
      - archived
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
        equipment:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
        archived: *id006
    WorkoutPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Workout'
        next:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
    ExercisePage:
      type: object
      additionalProperties: false
      required:
      - items
      - next
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Exercise'
        next:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
    Login:
      type: object
      additionalProperties: false
      required:
      - client
      - username
      - password
      properties:
        client:
          enum:
          - browser
          - android
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        secondFactor:
          type: string
          minLength: 1
          maxLength: 43
          description: Authenticator or one-time recovery code required for an enrolled owner.
    Session:
      type: object
      additionalProperties: false
      required:
      - expiresAt
      - scope
      properties:
        expiresAt: *id005
        scope:
          $ref: '#/components/schemas/Scope'
        csrfToken:
          type: string
        accessToken:
          type: string
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          enum:
          - ok
          - ready
    BackupStatus:
      type: object
      additionalProperties: false
      required:
      - lastVerifiedAt
      - state
      properties:
        lastVerifiedAt:
          anyOf:
          - *id005
          - type: 'null'
        state:
          enum:
          - never
          - running
          - verified
          - failed
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - SCOPE_MISMATCH
          - MISSING_DEPENDENCY
          - IDEMPOTENCY_MISMATCH
          - CONFLICT_CHANGED
          - UNSUPPORTED_VERSION
          - LIMIT_EXCEEDED
          - CURSOR_EXPIRED
          - RATE_LIMITED
          - UNAVAILABLE
        message:
          type: string
          maxLength: 512
        requestId: *id001
  responses:
    Http503:
      description: Unavailable. Retry with backoff and leave the outbox intact.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http400:
      description: Invalid request or unsupported protocol/payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http401:
      description: Session expired or absent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http403:
      description: Forbidden, including failed CSRF check
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http429:
      description: Rate limited. Honor Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds before retry
    Http408:
      description: Stroke upload timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http409:
      description: Scope, operation identity, dependency or conflict-head mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http413:
      description: Request exceeds a documented size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http410:
      description: Cursor expired. Preserve local operations and restart bootstrap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Http404:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
